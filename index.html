<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slideshow — Gallery Prototype</title>
<!--
  ============================================================================
  PROTOTYPE — throwaway. Answers: "what should this gallery look like?"
  Three radically different layouts on one page, switch with ?variant= or the
  floating bottom bar. Pick a winner (or steal bits), then we fold it into the
  real thing and delete the losers. See NOTES.md.

  HOW TO RUN (auto-discovers every image in this folder & opens the browser):
      cd into this folder, then:
      python3 serve.py

  Or just open this file directly and use the "Pick folder" / drag-drop
  fallback (file:// can't list sibling files for security reasons).
  ============================================================================
-->
<style>
  :root {
    --bg: #0e0f12;
    --bg-soft: #16181d;
    --fg: #e9eaec;
    --fg-dim: #9aa0aa;
    --line: #262a31;
    --accent: #6ea8fe;
    --gap: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  img { display: block; }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* ---- empty / loading state ---- */
  #empty {
    position: fixed; inset: 0; display: grid; place-items: center; text-align: center;
    padding: 24px; z-index: 5;
  }
  #empty .card {
    max-width: 460px; background: var(--bg-soft); border: 1px solid var(--line);
    border-radius: 14px; padding: 28px 26px;
  }
  #empty h1 { margin: 0 0 6px; font-size: 18px; font-weight: 600; }
  #empty p { margin: 6px 0; color: var(--fg-dim); }
  #empty code {
    background: #000; border: 1px solid var(--line); border-radius: 6px;
    padding: 2px 6px; color: #cdd3da; font-size: 12.5px;
  }
  .dropzone { border: 1px dashed var(--line); border-radius: 10px; padding: 18px; margin-top: 16px; transition: .15s; }
  .dropzone.hot { border-color: var(--accent); background: rgba(110,168,254,.08); }
  .pick {
    margin-top: 14px; background: var(--accent); color: #07101f; border: none;
    border-radius: 8px; padding: 9px 16px; font-weight: 600;
  }
  .pick:hover { filter: brightness(1.08); }

  /* ---- stage shared ---- */
  #stage { min-height: 100%; }
  .count-pill {
    position: fixed; top: 12px; left: 12px; z-index: 4;
    background: rgba(0,0,0,.5); border: 1px solid var(--line); backdrop-filter: blur(8px);
    color: var(--fg-dim); padding: 4px 10px; border-radius: 999px; font-size: 12px;
  }

  /* ======================= VARIANT A — MASONRY ======================= */
  .masonry { columns: 4 240px; column-gap: var(--gap); padding: 14px; padding-bottom: 80px; }
  .masonry figure { margin: 0 0 var(--gap); break-inside: avoid; position: relative; }
  .masonry img {
    width: 100%; height: auto; border-radius: 10px; cursor: zoom-in;
    background: var(--bg-soft); transition: transform .18s, box-shadow .18s;
  }
  .masonry img:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(0,0,0,.5); }
  .masonry figcaption {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 10px 8px;
    font-size: 11px; color: #fff; opacity: 0; transition: opacity .18s; pointer-events: none;
    border-radius: 0 0 10px 10px;
    background: linear-gradient(transparent, rgba(0,0,0,.72));
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .masonry figure:hover figcaption { opacity: 1; }

  /* ======================= VARIANT B — SLIDESHOW ======================= */
  .show { position: fixed; inset: 0; display: flex; flex-direction: column; background: #000; }
  .show-main { flex: 1; position: relative; display: grid; place-items: center; overflow: hidden; }
  .show-main img { max-width: 94vw; max-height: calc(100vh - 96px); object-fit: contain; }
  .show-nav {
    position: absolute; top: 0; bottom: 0; width: 22%; border: none; background: transparent;
    color: #fff; font-size: 30px; opacity: 0; transition: opacity .15s;
  }
  .show-main:hover .show-nav { opacity: .55; }
  .show-nav:hover { opacity: 1 !important; }
  .show-nav.prev { left: 0; } .show-nav.next { right: 0; }
  .show-meta {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    color: var(--fg-dim); font-size: 12px; background: rgba(0,0,0,.45);
    padding: 4px 12px; border-radius: 999px; max-width: 60vw; overflow: hidden;
    white-space: nowrap; text-overflow: ellipsis;
  }
  .filmstrip {
    height: 84px; display: flex; gap: 6px; padding: 8px; overflow-x: auto;
    background: #070708; border-top: 1px solid var(--line); scrollbar-width: thin;
  }
  .filmstrip img {
    height: 100%; width: auto; border-radius: 5px; opacity: .42; cursor: pointer;
    border: 2px solid transparent; transition: opacity .15s;
  }
  .filmstrip img:hover { opacity: .8; }
  .filmstrip img.active { opacity: 1; border-color: var(--accent); }
  .playbtn {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.5); border: 1px solid var(--line); color: #fff;
    border-radius: 999px; padding: 6px 16px; font-size: 12px; backdrop-filter: blur(6px);
  }

  /* ======================= VARIANT C — JUSTIFIED ROWS ======================= */
  .justified { padding: 14px; padding-bottom: 80px; display: flex; flex-direction: column; gap: var(--gap); }
  .jrow { display: flex; gap: var(--gap); }
  .jrow figure { margin: 0; position: relative; overflow: hidden; border-radius: 8px; }
  .jrow img { height: 100%; width: 100%; object-fit: cover; cursor: zoom-in; display: block;
    transition: transform .2s; }
  .jrow figure:hover img { transform: scale(1.04); }

  /* ---- lightbox (shared by A & C) ---- */
  #lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,.94); z-index: 30;
    display: none; place-items: center;
  }
  #lightbox.open { display: grid; }
  #lightbox img { max-width: 92vw; max-height: 92vh; object-fit: contain; }
  #lightbox .lb-close, #lightbox .lb-nav {
    position: absolute; background: none; border: none; color: #fff; opacity: .7;
  }
  #lightbox .lb-close { top: 16px; right: 22px; font-size: 30px; }
  #lightbox .lb-nav { top: 50%; transform: translateY(-50%); font-size: 40px; padding: 20px; }
  #lightbox .lb-nav.prev { left: 8px; } #lightbox .lb-nav.next { right: 8px; }
  #lightbox button:hover { opacity: 1; }

  /* ---- floating prototype switcher ---- */
  #switcher {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 50;
    display: flex; align-items: center; gap: 4px;
    background: rgba(20,22,28,.92); border: 1px solid #333a45; backdrop-filter: blur(10px);
    border-radius: 999px; padding: 5px 6px; box-shadow: 0 10px 40px rgba(0,0,0,.55);
  }
  #switcher button { background: none; border: none; color: var(--fg); border-radius: 999px;
    width: 32px; height: 32px; font-size: 16px; display: grid; place-items: center; }
  #switcher button:hover { background: #2a2f38; }
  #switcher .label { padding: 0 12px; font-size: 12.5px; white-space: nowrap; }
  #switcher .label b { color: var(--accent); }
  #switcher .hint { color: var(--fg-dim); font-size: 11px; padding-right: 8px; }
</style>
</head>
<body>

<div id="empty">
  <div class="card">
    <h1>Drop-in Gallery</h1>
    <p>No images found in this folder yet.</p>
    <p>Run this from the folder to auto-load every image:</p>
    <p><code>python3 serve.py</code></p>
    <div class="dropzone" id="dropzone">
      <p style="margin:0">…or drag image files here</p>
      <button class="pick" id="pickBtn">Pick a folder</button>
      <input id="folderInput" type="file" accept="image/*" webkitdirectory multiple hidden>
    </div>
  </div>
</div>

<div class="count-pill" id="countPill" hidden></div>
<main id="stage"></main>

<div id="lightbox">
  <button class="lb-close" aria-label="Close">×</button>
  <button class="lb-nav prev" aria-label="Previous">‹</button>
  <img alt="">
  <button class="lb-nav next" aria-label="Next">›</button>
</div>

<nav id="switcher" hidden>
  <button id="prevVariant" aria-label="Previous layout">‹</button>
  <span class="label" id="variantLabel"></span>
  <button id="nextVariant" aria-label="Next layout">›</button>
  <span class="hint">[ ] to switch</span>
</nav>

<script>
"use strict";

const IMG_RE = /\.(jpe?g|png|gif|webp|avif|bmp|svg)(\?|$)/i;
const VARIANTS = [
  { key: "A", name: "Masonry grid",      render: renderMasonry },
  { key: "B", name: "Fullscreen slideshow", render: renderSlideshow },
  { key: "C", name: "Justified rows",    render: renderJustified },
];

let images = [];          // [{ url, name }]
let currentVariant = "A";
let slideIndex = 0;       // shared cursor for slideshow + lightbox

/* ---------------- image discovery ---------------- */
async function discoverFromServer() {
  // 1. serve.py manifest — the reliable path.
  try {
    const res = await fetch("/__images", { cache: "no-store" });
    if (res.ok) {
      const names = await res.json();
      if (Array.isArray(names) && names.length)
        return names.map(n => ({ url: encodeURIComponent(n), name: n }));
    }
  } catch { /* not running serve.py — fall through */ }

  // 2. plain directory listing (e.g. `python3 -m http.server` when this file
  //    isn't the folder's index). Harmlessly returns [] if it gets our own page.
  try {
    const res = await fetch("./", { headers: { Accept: "text/html" } });
    if (!res.ok) return [];
    const html = await res.text();
    const doc = new DOMParser().parseFromString(html, "text/html");
    return [...doc.querySelectorAll("a")]
      .map(a => a.getAttribute("href") || "")
      .filter(h => IMG_RE.test(h) && !h.startsWith("?") && !h.startsWith("/"))
      .map(h => ({ url: h, name: decodeURIComponent(h.split("/").pop()) }));
  } catch { return []; }
}

function naturalSort(a, b) {
  return a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: "base" });
}

function setImages(list) {
  images = list.sort(naturalSort);
  if (!images.length) return;
  document.getElementById("empty").style.display = "none";
  const pill = document.getElementById("countPill");
  pill.hidden = false;
  pill.textContent = images.length + " image" + (images.length === 1 ? "" : "s");
  document.getElementById("switcher").hidden = false;
  paint();
}

/* ---------------- variant routing ---------------- */
function paint() {
  const v = VARIANTS.find(v => v.key === currentVariant) || VARIANTS[0];
  const lbl = document.getElementById("variantLabel");
  lbl.innerHTML = `<b>${v.key}</b> — ${v.name}`;
  const stage = document.getElementById("stage");
  stage.innerHTML = "";
  v.render(stage);
}

function gotoVariant(key) {
  currentVariant = key;
  const url = new URL(location.href);
  url.searchParams.set("variant", key);
  history.replaceState(null, "", url);
  paint();
}
function cycleVariant(dir) {
  const i = VARIANTS.findIndex(v => v.key === currentVariant);
  gotoVariant(VARIANTS[(i + dir + VARIANTS.length) % VARIANTS.length].key);
}

/* ---------------- VARIANT A — masonry ---------------- */
function renderMasonry(stage) {
  const wrap = document.createElement("div");
  wrap.className = "masonry";
  images.forEach((im, i) => {
    const fig = document.createElement("figure");
    const img = document.createElement("img");
    img.loading = "lazy"; img.src = im.url; img.alt = im.name;
    img.addEventListener("click", () => openLightbox(i));
    const cap = document.createElement("figcaption");
    cap.textContent = im.name;
    fig.append(img, cap);
    wrap.append(fig);
  });
  stage.append(wrap);
}

/* ---------------- VARIANT B — slideshow ---------------- */
let autoTimer = null;
function renderSlideshow(stage) {
  if (slideIndex >= images.length) slideIndex = 0;
  const root = document.createElement("div");
  root.className = "show";
  root.innerHTML = `
    <div class="show-main">
      <div class="show-meta"></div>
      <button class="show-nav prev" aria-label="Previous">‹</button>
      <img alt="">
      <button class="show-nav next" aria-label="Next">›</button>
      <button class="playbtn">▶ Play</button>
    </div>
    <div class="filmstrip"></div>`;
  stage.append(root);

  const big = root.querySelector(".show-main img");
  const meta = root.querySelector(".show-meta");
  const strip = root.querySelector(".filmstrip");
  const playBtn = root.querySelector(".playbtn");

  images.forEach((im, i) => {
    const t = document.createElement("img");
    t.loading = "lazy"; t.src = im.url; t.alt = im.name;
    t.addEventListener("click", () => show(i));
    strip.append(t);
  });

  function show(i) {
    slideIndex = (i + images.length) % images.length;
    const im = images[slideIndex];
    big.src = im.url; big.alt = im.name;
    meta.textContent = `${slideIndex + 1} / ${images.length}  ·  ${im.name}`;
    [...strip.children].forEach((c, idx) => c.classList.toggle("active", idx === slideIndex));
    const active = strip.children[slideIndex];
    if (active) active.scrollIntoView({ inline: "center", block: "nearest" });
  }
  function stopAuto() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; playBtn.textContent = "▶ Play"; } }
  function toggleAuto() {
    if (autoTimer) return stopAuto();
    playBtn.textContent = "❚❚ Pause";
    autoTimer = setInterval(() => show(slideIndex + 1), 2500);
  }

  root.querySelector(".prev").addEventListener("click", () => { stopAuto(); show(slideIndex - 1); });
  root.querySelector(".next").addEventListener("click", () => { stopAuto(); show(slideIndex + 1); });
  playBtn.addEventListener("click", toggleAuto);

  // local key handling while slideshow is mounted
  root._keys = (e) => {
    if (e.key === "ArrowLeft")  { stopAuto(); show(slideIndex - 1); }
    if (e.key === "ArrowRight") { stopAuto(); show(slideIndex + 1); }
  };
  show(slideIndex);
}

/* ---------------- VARIANT C — justified rows ---------------- */
function renderJustified(stage) {
  // Greedy row packing: aim for ~260px row height at current width.
  const wrap = document.createElement("div");
  wrap.className = "justified";
  stage.append(wrap);

  const TARGET = 260, GAP = 10;
  const containerW = wrap.clientWidth || window.innerWidth - 28;

  // We need aspect ratios. Load them, then pack. Show a quick skeleton meanwhile.
  Promise.all(images.map(loadRatio)).then(ratios => {
    wrap.innerHTML = "";
    let row = [], rowRatio = 0;
    const flush = (isLast) => {
      if (!row.length) return;
      const rowEl = document.createElement("div");
      rowEl.className = "jrow";
      const avail = containerW - GAP * (row.length - 1);
      let h = avail / rowRatio;
      if (isLast) h = Math.min(h, TARGET); // don't blow up a lonely last row
      row.forEach(({ im, idx, r }) => {
        const fig = document.createElement("figure");
        fig.style.width = (r * h) + "px";
        fig.style.height = h + "px";
        const img = document.createElement("img");
        img.loading = "lazy"; img.src = im.url; img.alt = im.name;
        img.addEventListener("click", () => openLightbox(idx));
        fig.append(img);
        rowEl.append(fig);
      });
      wrap.append(rowEl);
      row = []; rowRatio = 0;
    };
    images.forEach((im, idx) => {
      const r = ratios[idx] || 1.5;
      row.push({ im, idx, r });
      rowRatio += r;
      if (containerW / rowRatio <= TARGET) flush(false);
    });
    flush(true);
  });
}
function loadRatio(im) {
  return new Promise(res => {
    const i = new Image();
    i.onload = () => res(i.naturalWidth / i.naturalHeight || 1.5);
    i.onerror = () => res(1.5);
    i.src = im.url;
  });
}

/* ---------------- shared lightbox (A & C) ---------------- */
const lb = document.getElementById("lightbox");
const lbImg = lb.querySelector("img");
function openLightbox(i) { slideIndex = i; lb.classList.add("open"); paintLightbox(); }
function closeLightbox() { lb.classList.remove("open"); }
function paintLightbox() {
  const im = images[slideIndex];
  lbImg.src = im.url; lbImg.alt = im.name;
}
function lbStep(d) { slideIndex = (slideIndex + d + images.length) % images.length; paintLightbox(); }
lb.querySelector(".lb-close").addEventListener("click", closeLightbox);
lb.querySelector(".lb-nav.prev").addEventListener("click", e => { e.stopPropagation(); lbStep(-1); });
lb.querySelector(".lb-nav.next").addEventListener("click", e => { e.stopPropagation(); lbStep(1); });
lb.addEventListener("click", e => { if (e.target === lb) closeLightbox(); });

/* ---------------- global keys ---------------- */
document.addEventListener("keydown", e => {
  if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  // variant switching
  if (e.key === "[") return cycleVariant(-1);
  if (e.key === "]") return cycleVariant(1);
  // lightbox has priority for arrows when open
  if (lb.classList.contains("open")) {
    if (e.key === "Escape") closeLightbox();
    if (e.key === "ArrowLeft") lbStep(-1);
    if (e.key === "ArrowRight") lbStep(1);
    return;
  }
  // otherwise let the mounted slideshow handle arrows
  const show = document.querySelector(".show");
  if (show && show._keys) show._keys(e);
});

/* ---------------- switcher wiring ---------------- */
document.getElementById("prevVariant").addEventListener("click", () => cycleVariant(-1));
document.getElementById("nextVariant").addEventListener("click", () => cycleVariant(1));

/* ---------------- fallback: folder picker / drag-drop ---------------- */
function fromFiles(fileList) {
  const list = [...fileList]
    .filter(f => f.type.startsWith("image/") || IMG_RE.test(f.name))
    .map(f => ({ url: URL.createObjectURL(f), name: f.name }));
  if (list.length) setImages(list);
}
document.getElementById("pickBtn").addEventListener("click", () => document.getElementById("folderInput").click());
document.getElementById("folderInput").addEventListener("change", e => fromFiles(e.target.files));
const dz = document.getElementById("dropzone");
["dragover", "dragenter"].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add("hot"); }));
["dragleave", "drop"].forEach(ev => dz.addEventListener(ev, () => dz.classList.remove("hot")));
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => { e.preventDefault(); if (e.dataTransfer.files.length) fromFiles(e.dataTransfer.files); });

/* re-pack justified rows on resize */
let rz; window.addEventListener("resize", () => {
  if (currentVariant !== "C") return;
  clearTimeout(rz); rz = setTimeout(paint, 150);
});

/* ---------------- boot ---------------- */
(function init() {
  currentVariant = new URL(location.href).searchParams.get("variant") || "A";
  if (!VARIANTS.some(v => v.key === currentVariant)) currentVariant = "A";
  discoverFromServer().then(list => { if (list.length) setImages(list); });
})();
</script>
</body>
</html>
